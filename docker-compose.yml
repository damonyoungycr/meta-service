x-kafka-image: &kafka-image
  image: qc-meta-kafka:2.6.3
  build:
    context: deployment/kafka
    args:
      KAFKA_ARCHIVE: kafka_2.13-2.6.3.tgz

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: qc_meta
      MYSQL_USER: qc_meta
      MYSQL_PASSWORD: Bq92zuJZVeCXGrfgWPv5mgtMCZIR4Y8y
      MYSQL_ROOT_PASSWORD: Bq92zuJZVeCXGrfgWPv5mgtMCZIR4Y8y
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 3s
      timeout: 3s
      retries: 30
    ports:
      - "3306:3306"
    volumes:
      - qc-meta-spring-mysql:/var/lib/mysql

  zookeeper:
    <<: *kafka-image
    restart: unless-stopped
    command: ["/opt/kafka/bin/zookeeper-server-start.sh", "/opt/kafka/config/zookeeper-local.properties"]
    environment:
      KAFKA_HEAP_OPTS: -Xms128m -Xmx256m
    volumes:
      - qc-meta-spring-zookeeper26-data:/var/lib/zookeeper/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-run-class.sh org.apache.zookeeper.client.FourLetterWordMain 127.0.0.1 2181 ruok 2>/dev/null | grep -q imok"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  kafka:
    <<: *kafka-image
    hostname: kafka
    restart: unless-stopped
    environment:
      QC_KAFKA_ADVERTISED_HOST: 172.18.64.68
      QC_KAFKA_HOST_PORT: 9092
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    ports:
      - "127.0.0.1:9092:9092"
      - "172.18.64.68:9092:9092"
    volumes:
      - qc-meta-spring-kafka26-data:/var/lib/kafka/data
    depends_on:
      zookeeper:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  kafka-init:
    <<: *kafka-image
    restart: "no"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092
        --create --if-not-exists --topic qc-meta-message-send-v1
        --partitions 4 --replication-factor 1
    depends_on:
      kafka:
        condition: service_healthy

  app:
    build: .
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - --spring.profiles.active=dev
      - --spring.datasource.file-name=/app/database-config.properties
      - --qc.kafka.bootstrap-servers=kafka:19092
    configs:
      - source: app-database
        target: /app/database-config.properties
    volumes:
      - ./src/main/resources/dev:/app/dev:ro
    ports:
      - "18080:8910"
      - "9090:8920"
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

volumes:
  qc-meta-spring-mysql:
  qc-meta-spring-kafka26-data:
  qc-meta-spring-zookeeper26-data:

configs:
  app-database:
    content: |
      spring.datasource.url=jdbc:mysql://mysql:3306/qc_meta?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
      spring.datasource.username=qc_meta
      spring.datasource.password=Bq92zuJZVeCXGrfgWPv5mgtMCZIR4Y8y
      spring.datasource.hikari.maximum-pool-size=20
      spring.datasource.hikari.minimum-idle=2
      spring.datasource.hikari.connection-timeout=10000
